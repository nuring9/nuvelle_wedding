server {
    listen 80;
    server_name nuvelle-wedding.site www.nuvelle-wedding.site;

    # HTTP로 들어온 요청은 전부 HTTPS로 이동시킨다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nuvelle-wedding.site www.nuvelle-wedding.site;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/nuvelle-wedding.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuvelle-wedding.site/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/geocode {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
