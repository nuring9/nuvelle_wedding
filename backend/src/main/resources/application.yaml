spring:
  application:
    name: nuvelle-wedding-backend # 애플리케이션 이름

  profiles:
    active: dev # 기본 실행 프로필 dev 사용

  jpa:
    hibernate:
      ddl-auto: update # 엔티티 기준으로 DB 테이블 자동 업데이트(테이블과 데이터를 최대한 유지)
    show-sql: true # 실행되는 SQL 로그 출력
    properties:
      hibernate:
        format_sql: true # SQL 로그를 보기 좋게 줄바꿈
        dialect: org.hibernate.dialect.MySQLDialect # MySQL 문법 사용
        jdbc:
          time_zone: Asia/Seoul # Hibernate가 DB에 날짜/시간을 저장하고 조회할 때 사용할 시간대

  servlet:
    multipart:
      max-file-size: 10MB # 업로드 파일 1개 최대 크기
      max-request-size: 50MB # 요청 전체 최대 크기

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@nuvelle.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET} # JWT 서명에 사용할 비밀키
  access-token-expiration: 1800000 # Access Token 만료 시간, 30분
  refresh-token-expiration: 604800000 # Refresh Token 만료 시간, 7일

kakao:
  client-id: ${KAKAO_CLIENT_ID:kakao-client-id-not-set}
  client-secret: ${KAKAO_CLIENT_SECRET:kakao-client-secret-not-set}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}


cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}      # S3 버킷 이름 nuvelle-wedding-prod-assets
    region:
      static: ap-northeast-2        # AWS 서울 리전
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID} # AWS Access Key
      secret-key: ${AWS_SECRET_ACCESS_KEY} # AWS Secret Key

