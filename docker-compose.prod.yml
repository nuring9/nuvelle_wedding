services:
  nginx:
    image: nginx:alpine
    container_name: nuvelle-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://3.35.8.61
    container_name: nuvelle-frontend
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nuvelle-backend
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: nuvelle-redis
    expose:
      - "6379"
    restart: unless-stopped
